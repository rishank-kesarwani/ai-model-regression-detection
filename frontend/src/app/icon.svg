<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="30" y1="10" x2="54" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Shield Outline -->
  <path d="M32 10C22 10 16 16 16 26C16 41 28 50 32 54C36 50 48 41 48 26C48 16 42 10 32 10Z" 
        stroke="url(#shieldGrad)" 
        stroke-width="2.5" 
        stroke-linejoin="round"
        fill="#0F172A"
        fill-opacity="0.6"
        filter="url(#glow)" />

  <!-- Inner Neural Graph -->
  <!-- Nodes -->
  <circle cx="24" cy="24" r="2.2" fill="#C084FC" />
  <circle cx="32" cy="20" r="2.2" fill="#818CF8" />
  <circle cx="40" cy="26" r="2.2" fill="#38BDF8" />
  <circle cx="23" cy="36" r="2.2" fill="#A855F7" />
  <circle cx="32" cy="38" r="2.2" fill="#6366F1" />
  <circle cx="41" cy="37" r="2.2" fill="#06B6D4" />
  <circle cx="32" cy="47" r="2" fill="#38BDF8" />

  <!-- Neural Connection Lines -->
  <path d="M24 24L32 20L40 26 M24 24L23 36 M32 20L32 38 M40 26L41 37 M23 36L32 38L41 37 M23 36L32 47L41 37" 
        stroke="#818CF8" 
        stroke-width="1" 
        stroke-opacity="0.4" />

  <!-- Dynamic Trendline Pulse -->
  <path d="M18 34L26 34L30 26L35 37L46 16" 
        stroke="url(#shieldGrad)" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- AI Star / Sparkle at Peak -->
  <path d="M46 16L48 11L50 16L55 18L50 20L48 25L46 20L41 18Z" 
        fill="url(#sparkGrad)" 
        filter="url(#glow)" />
</svg>
